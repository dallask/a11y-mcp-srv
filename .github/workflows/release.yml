name: Release

on:
  push:
    branches:
      - 'release/*'

permissions:
  contents: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup nvm
        uses: nvm-sh/setup-nvm@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Use Node version from .nvmrc
        run: nvm use

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:run

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Release
        env:
          # Use repo secret GH_TOKEN (Settings → Secrets). Passed as GITHUB_TOKEN for semantic-release.
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
